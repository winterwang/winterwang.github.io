<style>
  :root {
    scroll-padding-top: var(--hb-header-offset, 5.5rem);
  }

  body {
    padding-top: var(--hb-header-offset, 5.5rem);
    transition: padding-top 0.2s ease;
  }

  #site-header.header {
    position: fixed !important;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999;
    width: 100%;
    backdrop-filter: blur(6px);
    background-color: rgba(255, 255, 255, 0.97);
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05);
  }

  .dark #site-header.header {
    background-color: rgba(24, 24, 27, 0.97);
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.45);
  }

  .resume-biography .bio-text {
    max-width: min(960px, 90vw);
    margin-left: auto;
    margin-right: auto;
  }

  @media (max-width: 768px) {
    .resume-biography .bio-text {
      max-width: 100%;
      padding-left: 1rem;
      padding-right: 1rem;
    }
  }

  .back-to-top {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 3rem;
    height: 3rem;
    border-radius: 9999px;
    border: none;
    color: #ffffff;
    background: linear-gradient(160deg, var(--color-primary-600, #2563eb), var(--color-primary-500, #3b82f6));
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.25);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    z-index: 1100;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .back-to-top:hover {
    transform: translateY(-3px);
  }

  .back-to-top.show {
    opacity: 1;
    pointer-events: auto;
  }

  .dark .back-to-top {
    background: linear-gradient(160deg, var(--color-primary-500, #3b82f6), var(--color-primary-400, #60a5fa));
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.45);
  }

  @media (max-width: 640px) {
    .back-to-top {
      bottom: 1rem;
      right: 1rem;
      width: 2.75rem;
      height: 2.75rem;
    }
  }

  .contact-form {
    margin-top: 1.5rem;
  }

  .contact-form label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
  }

  .contact-form input,
  .contact-form textarea {
    width: 100%;
    margin-bottom: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    border: 1px solid rgba(148, 163, 184, 0.5);
    background-color: rgba(255, 255, 255, 0.9);
    color: #0f172a;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .contact-form input:focus,
  .contact-form textarea:focus {
    border-color: var(--color-primary-500, #2563eb);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    outline: none;
  }

  .dark .contact-form input,
  .dark .contact-form textarea {
    background-color: rgba(17, 24, 39, 0.85);
    border-color: rgba(100, 116, 139, 0.5);
    color: #f8fafc;
  }

  .dark .contact-form input:focus,
  .dark .contact-form textarea:focus {
    border-color: var(--color-primary-400, #60a5fa);
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.25);
  }

  .contact-form button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    border-radius: 9999px;
    font-weight: 600;
    color: #ffffff;
    background: linear-gradient(90deg, var(--color-primary-600, #2563eb), var(--color-primary-500, #3b82f6));
    border: none;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .contact-form button:hover {
    transform: translateY(-2px);
    opacity: 0.95;
  }

  .contact-form button:active {
    transform: translateY(0);
    opacity: 1;
  }

  .contact-form + p {
    margin-top: 0.75rem;
    font-size: 0.9rem;
    color: rgba(100, 116, 139, 0.9);
  }

  .dark .contact-form + p {
    color: rgba(148, 163, 184, 0.9);
  }

  .support-options {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 1.5rem;
    margin: 1.25rem 0;
  }

  .support-option {
    flex: 0 1 160px;
  }

  .support-option-title {
    margin: 0 0 0.5rem;
    font-weight: 600;
  }

  .support-option-note {
    margin: 0.5rem 0 0;
    font-size: 0.85rem;
    color: rgba(100, 116, 139, 0.9);
  }

  .dark .support-option-note {
    color: rgba(148, 163, 184, 0.9);
  }

  .paypal-qr-code {
    width: 160px;
    max-width: 100%;
    height: auto;
  }

  .wechat-qr-code {
    width: 160px;
    max-width: 100%;
    height: auto;
  }

  .paypal-support-button {
    display: inline-block;
    margin: 0;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const header = document.getElementById('site-header');
    if (header) {
      const updateHeaderOffset = () => {
        const height = header.offsetHeight;
        document.documentElement.style.setProperty('--hb-header-offset', `${height}px`);
        document.body.style.paddingTop = `${height}px`;
      };

      updateHeaderOffset();
      window.addEventListener('resize', updateHeaderOffset, { passive: true });
    }

    const currentYear = new Date().getFullYear();
    document.querySelectorAll('[data-footer-year]').forEach((el) => {
      el.textContent = currentYear;
    });
  });
</script>
